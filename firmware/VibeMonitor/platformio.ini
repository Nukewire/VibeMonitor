; VibeMonitor firmware — ESP32-2432S028R (Cheap Yellow Display), LVGL UI.
; TFT_eSPI configured via build_flags (no User_Setup.h file needed).
; lv_conf.h lives in include/ and is found via -DLV_CONF_INCLUDE_SIMPLE + -I include.

[env:cyd]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 460800
board_build.partitions = huge_app.csv   ; 3MB app slot (4MB flash board); default was too small
lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    lvgl/lvgl@^8.3.11
    bblanchon/ArduinoJson@^7.0.4
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git
build_flags =
    -DUSER_SETUP_LOADED=1
    ; AITRIP ESP32-2432S028R uses the ST7789 controller (NOT ILI9341 like the
    ; DIYmall reference board). Confirmed by on-device color/geometry tests:
    ; ST7789 + INVERSION_OFF + BGR gives correct landscape + correct colors.
    -DST7789_DRIVER=1
    -DTFT_INVERSION_OFF=1
    -DTFT_RGB_ORDER=TFT_BGR
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_MISO=12
    ; TFT_WIDTH/HEIGHT are the NATIVE portrait dims; setRotation(1) -> 320x240 landscape.
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1
    -DTFT_BL=21
    -DTFT_BACKLIGHT_ON=HIGH
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DSPI_FREQUENCY=55000000
    -DSPI_READ_FREQUENCY=20000000
    -DSPI_TOUCH_FREQUENCY=2500000
    -DLV_CONF_INCLUDE_SIMPLE=1
    -I include
