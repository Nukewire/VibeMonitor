# VibeMonitor bridge configuration — EXAMPLE.
# Copy this file to config.toml and edit. Keep config.toml out of version control
# (it holds your shared secret); it is already listed in .gitignore.

# Shared secret the device sends as the X-VibeMonitor-Token header on every request.
# Use a long random string. NEVER commit your real token.
token = "change-me-to-a-random-secret"

# Host/port the hub binds to. 0.0.0.0 exposes it on the LAN so the device can reach it.
host = "0.0.0.0"
port = 5151

[thresholds]
working_sec     = 60      # a session shows "working" if its log changed within this many seconds
waiting_ttl_sec = 1800    # a "waiting" (needs-you) session stays highlighted this long, then decays to idle
gone_ttl_sec    = 14400   # quiet past N s => dropped from the list (4h)

[poll]
sessions_sec = 2.0     # how often to rescan local session files
usage_sec    = 60.0    # how often to refresh usage / rate-limit data

[providers]
claude = true
codex  = true

[claude]
# The Claude OAuth token used only locally for the usage probe. By default the
# bridge auto-reads it from ~/.claude/.credentials.json, so you usually leave this
# unset. Set it only to override the auto-detected value.
# oauth_token = "..."

[summary]
# Optional: AI one-line summaries of what each session is working on, shown on the
# device row and the web dashboard. The bridge reads the latest user prompt from the
# session log and asks a cheap model (via OpenRouter) for a 3-6 word description.
# Off by default — the prompt text is sent to a third party (OpenRouter), so opt in.
enabled = false
model = "google/gemma-4-31b-it:free"   # any OpenRouter model id; :free models cost nothing (but can rate-limit)
max_chars = 2000                                   # cap the prompt text sent to the model

[openrouter]
# Your OpenRouter API key (https://openrouter.ai/keys). Required only when
# [summary] enabled = true. Keep this out of version control.
# api_key = "sk-or-v1-..."
