[project]
name = "vibemonitor-bridge"
version = "0.1.0"
description = "VibeMonitor bridge: serves Claude Code + Codex session state to the CYD display."
requires-python = ">=3.11"
dependencies = ["flask>=3.0", "requests>=2.31"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["vibemonitor"]
